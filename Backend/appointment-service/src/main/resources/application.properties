# ============================================================
# APPOINTMENT SERVICE - Application Configuration
# ============================================================

spring.application.name=appointment-service
server.port=8006

# ============================================================
# DATABASE - PostgreSQL (appointmentdb)
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5435/appointmentdb
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# EUREKA SERVICE DISCOVERY
# ============================================================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=appointment-service
eureka.instance.prefer-ip-address=true

# ============================================================
# FEIGN CLIENT CONFIGURATION
# ============================================================
# Enable fallback support via Spring Cloud CircuitBreaker
spring.cloud.openfeign.circuitbreaker.enabled=true

# Feign logging level (NONE, BASIC, HEADERS, FULL)
logging.level.com.medical.appointmentservice.client=DEBUG

# ============================================================
# ACTUATOR
# ============================================================
management.endpoint.health.show-details=always

# ============================================================
# LOGGING
# ============================================================
logging.level.com.medical.appointmentservice=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================
# RESILIENCE4J — Circuit Breaker + Time Limiter
# Required for the *ClientFallback classes to be invoked.
# ============================================================
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

# Default TimeLimiter is 1s, which is too aggressive for cold-started containers
resilience4j.timelimiter.configs.default.timeout-duration=5s
resilience4j.timelimiter.configs.default.cancel-running-future=true

# Expose circuit breaker state so you can demo it
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.health.circuitbreakers.enabled=true

# ============================================================
# OAUTH2 RESOURCE SERVER (Keycloak)
# ============================================================
keycloak.realm=${KEYCLOAK_REALM:myheart}
keycloak.internal-url=${KEYCLOAK_INTERNAL_URL:http://keycloak:8080}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.internal-url}/realms/${keycloak.realm}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8480/realms/myheart}
