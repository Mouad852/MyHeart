# =============================================
# Billing Service Configuration
# =============================================

spring.application.name=billing-service
server.port=8002

# Eureka
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true

# DataSource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5436/billingdb
spring.datasource.username=${DB_USER:billing_user}
spring.datasource.password=${DB_PASS:billing_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.medical=DEBUG

# ---- Resource server -------------------------------------------------------
# Keys are fetched over the Docker network; the issuer claim is the address the
# browser used, so the two URLs deliberately differ.
keycloak.realm=${KEYCLOAK_REALM:myheart}
keycloak.internal-url=${KEYCLOAK_INTERNAL_URL:http://keycloak:8080}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.internal-url}/realms/${keycloak.realm}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8480/realms/myheart}
