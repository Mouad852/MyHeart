# =============================================
# Prescription Service Configuration
# =============================================

spring.application.name=prescription-service
server.port=8004

# Eureka
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true

# DataSource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5437/prescriptiondb
spring.datasource.username=${DB_USER:prescription_user}
spring.datasource.password=${DB_PASS:prescription_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.medical=DEBUG
