# ============================================================
# PATIENT SERVICE - Application Configuration
# ============================================================

# Application identity
spring.application.name=patient-service
server.port=8001

# ============================================================
# DATABASE - PostgreSQL (patientdb)
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5433/patientdb
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# EUREKA SERVICE DISCOVERY
# ============================================================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=patient-service
eureka.instance.prefer-ip-address=true

# ============================================================
# ACTUATOR (Health checks for Docker / monitoring)
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================================
# LOGGING
# ============================================================
logging.level.com.medical.patientservice=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================
# OAUTH2 RESOURCE SERVER (Keycloak)
# Keys are fetched over the Docker network; the issuer claim is the
# browser-facing URL, so the two are configured separately.
# ============================================================
keycloak.realm=${KEYCLOAK_REALM:myheart}
keycloak.internal-url=${KEYCLOAK_INTERNAL_URL:http://keycloak:8080}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.internal-url}/realms/${keycloak.realm}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8480/realms/myheart}
