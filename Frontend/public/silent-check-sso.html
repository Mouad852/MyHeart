<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Silent SSO check</title>
  </head>
  <body>
    <!--
      Keycloak loads this page in a hidden iframe to check for an existing
      session without a full-page redirect. It only forwards the result back to
      the main window; it renders nothing.
    -->
    <script>
      parent.postMessage(location.href, location.origin)
    </script>
  </body>
</html>
