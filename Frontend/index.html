    <!--
      Syne carries the wordmark, page titles and large figures.
      DM Sans carries every piece of operational text.

      width so a column of them lines up and a transposed digit is visible.
    -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..500&family=IBM+Plex+Mono:wght@400;500;600&display=swap"

    />
